[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-speech-server"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "mlx-whisper>=0.4",
    "mlx>=0.16",
    "pydantic>=2.0",
    "python-multipart",
    "click>=8.0",
    "loguru>=0.7",
    "setproctitle>=1.3",
]

[project.scripts]
mlx = "app.cli:cli"
mlx-run = "app.server:run_from_env"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests — run explicitly with: pytest tests/e2e/ -v -s"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]
